[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "direbench"
version = "0.1.0"
description = "Experimental defense-induced risk benchmark for isolated k3s clusters"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
direbench = "direbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
